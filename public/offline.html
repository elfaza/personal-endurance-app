<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f3f6f8"><title>Offline · Personal Endurance</title><script src="/theme.js"></script><style>:root{color-scheme:light;--bg:#f3f6f8;--panel:#fff;--text:#192b3a;--muted:#526576;--line:#dce4ec;--accent:#245fad;--on-accent:#fff}:root[data-theme="dark"]{color-scheme:dark;--bg:#171d25;--panel:#232e3b;--text:#edf2f7;--muted:#b2c0cf;--line:#415063;--accent:#8bb9f4;--on-accent:#132d4c}*{box-sizing:border-box}:focus-visible{outline:3px solid var(--accent);outline-offset:4px}body{background:var(--bg);color:var(--text);font:16px/1.65 system-ui,sans-serif;margin:0;padding:40px 24px}main{max-width:760px;margin:auto}img{width:50px}h1{font-size:36px;letter-spacing:-.8px;line-height:1.1}p,small{color:var(--muted)}button,a{font:inherit;color:var(--on-accent);background:var(--accent);border:0;border-radius:9px;padding:12px 18px;cursor:pointer;text-decoration:none;display:inline-block;margin:6px 4px 6px 0}section{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:12px 0;padding:16px}h2{font-size:20px}li{margin-bottom:12px}#status{color:var(--text)}</style></head><body><main><img src="/icon.svg" alt="Personal Endurance"><h1>A moment to<br>catch your breath.</h1><p>You’re offline. Here’s the last training snapshot saved in this browser. Editing and syncing resume when connected.</p><p id="status"></p><a href="/dashboard">Try reconnecting</a><button id="clear">Clear saved data</button><div id="snapshot"></div><small>Snapshots are stored on this device for offline reading. Clear them before sharing your browser.</small></main><script src="/offline.js" defer></script></body></html>
